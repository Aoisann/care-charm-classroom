<style>
:root{--ink:#263733;--muted:#667773;--paper:#fffdf8;--mint:#dceee7;--line:#d8e2dd;--shadow:0 18px 55px rgba(46,76,66,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Yu Gothic UI","Hiragino Sans",system-ui,sans-serif;background:radial-gradient(circle at 12% 8%,#e8f6ee 0,transparent 34%),linear-gradient(160deg,#fbf8ee,#edf6f3)}.wrap{width:min(1080px,calc(100% - 28px));margin:26px auto 55px}.back{display:inline-flex;align-items:center;gap:7px;color:#356f5c;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;text-decoration:none;font-weight:700}.back:hover,.back:focus-visible,.word:focus-visible,.close:focus-visible{outline:3px solid #8fc1ad;outline-offset:3px}.hero{text-align:center;margin:26px auto 18px}.eyebrow{font-size:.76rem;letter-spacing:.14em;color:#397260;font-weight:700}.hero h1{font-size:clamp(1.85rem,5vw,3rem);margin:.35rem 0}.hero p{max-width:720px;margin:.5rem auto;color:var(--muted);line-height:1.7}.note{font-size:.82rem;background:#fff9;border:1px solid var(--line);padding:10px 13px;border-radius:12px;display:inline-block}.cloud{background:var(--paper);border:1px solid #fff;border-radius:30% 30% 24px 24px/12% 12% 24px 24px;box-shadow:var(--shadow);padding:30px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;align-items:center}.word{border:0;border-radius:999px;padding:11px 13px;background:var(--c,#e1f0e9);color:#29443b;cursor:pointer;line-height:1.25;min-height:48px;overflow-wrap:anywhere;font-size:var(--s,1rem);grid-column:span var(--w,3);transform:translateY(var(--y,0));box-shadow:0 4px 12px #284f3e15}.word:hover{filter:saturate(1.1);transform:translateY(var(--y,0)) scale(1.035)}.word small{display:block;font-size:.64em;opacity:.7;margin-top:3px}.detail{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;scroll-margin-top:16px}.detail[hidden]{display:none}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:18px}.detail h2{margin:0;font-size:1.25rem}.close{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.variant{margin-top:15px;background:#f2f8f5;border:1px solid #d3e5dd;border-radius:14px;padding:15px}.variant h3{font-size:.76rem;color:#397260;margin:0 0 7px;letter-spacing:.05em}.original{font-size:1.08rem;line-height:1.7;white-space:pre-line;unicode-bidi:plaintext;text-align:start}.jp{border-top:1px solid #d0dfd8;margin-top:10px;padding-top:9px;line-height:1.7;white-space:pre-line;color:#53645f}.footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px}@media(max-width:760px){.cloud{grid-template-columns:repeat(2,minmax(0,1fr));padding:18px 14px;border-radius:24px;gap:9px}.word{grid-column:span 1!important;transform:none!important;font-size:clamp(.83rem,var(--s),1.15rem);min-height:58px}.word:hover{transform:scale(1.02)!important}}@media(max-width:420px){.cloud{grid-template-columns:1fr}.word{grid-column:1!important}.detail{padding:17px}}
</style><style>
html,body{height:100%;overflow:hidden}.wrap{position:relative;height:100svh;margin:0 auto;padding:8px 0;display:flex;flex-direction:column}.back{position:absolute;z-index:5;top:10px;left:0;padding:7px 11px}.hero{flex:0 0 auto;margin:0 auto 7px}.hero h1{font-size:clamp(1.5rem,3.7vw,2.35rem);margin:.05rem 0}.hero p{margin:.1rem auto;line-height:1.35}.note{padding:5px 9px}.cloud{display:block!important;position:relative;overflow:hidden;padding:0!important;min-height:0;border-radius:24px;transition:height .2s ease}.word{position:absolute!important;z-index:1;margin:0;border:1px solid #ffffffb8;border-radius:var(--r,22px);padding:var(--py,8px) 10px;min-height:var(--h,46px);transform:rotate(var(--rot,0deg));isolation:isolate;transition:transform .16s ease,filter .16s ease}.word::after{content:"";position:absolute;z-index:-1;width:14px;height:14px;background:var(--c,#e1f0e9);bottom:var(--tail-y,-6px);left:var(--tail-x,18%);transform:rotate(var(--tail-r,45deg));border-radius:2px 4px 8px 3px}.word.shape-a{--r:28px 28px 28px 8px;--tail-x:12%;--tail-r:32deg}.word.shape-b{--r:50% 24px 46% 22px/34px 50% 28px 46%;--tail-x:76%;--tail-r:58deg}.word.shape-c{--r:18px 38px 16px 34px;--tail-x:48%;--tail-r:44deg}.word.shape-d{--r:42% 20px 42% 12px/26px 44% 24px 40%;--tail-x:8%;--tail-r:25deg}.word.shape-e{--r:999px;--tail-x:82%;--tail-r:64deg}.word:hover{z-index:2;transform:rotate(var(--rot,0deg)) scale(1.04)}.detail{position:fixed;z-index:20;inset:8vh max(14px,calc((100vw - 760px)/2));margin:0;max-height:84vh;overflow:auto}.footer{display:none}
@media(max-width:760px){.wrap{padding:8px 0}.back{font-size:.82rem}.hero{margin:4px auto 7px}.hero .eyebrow{font-size:.63rem}.hero h1{font-size:1.45rem}.hero p{font-size:.78rem;line-height:1.35}.note{font-size:.66rem;line-height:1.3}.word{font-size:clamp(.66rem,var(--s),.9rem);min-height:40px;padding:6px 8px}.word small{font-size:.58em;margin-top:1px}.word::after{bottom:-5px;width:11px;height:11px}.detail{inset:4vh 10px;max-height:92vh}}@media(prefers-reduced-motion:reduce){.cloud,.word,.word:hover{transition:none}.word,.word:hover{transform:none!important}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← チャットに戻る</a><header class="hero"><div class="eyebrow">22 LANGUAGES &amp; REGIONS</div><h1>世界のおまじないクラウド</h1><p>世界の「痛いの痛いの飛んでけ」に近い言葉を、形も大きさも異なる吹き出しで集めました。言葉を選ぶと、原文全文と日本語訳を確認できます。</p><div class="note">吹き出しの形・大きさ・色・位置は見た目のリズムのための配置です。人気度、使用頻度、言語の優劣を示しません。</div></header><section class="cloud" id="cloud" aria-label="22の言語と地域のおまじない"></section><section class="detail" id="detail" hidden tabindex="-1" aria-live="polite"><div class="detail-head"><h2 id="detailName"></h2><button class="close" id="close" type="button">閉じる</button></div><div id="variants"></div></section><div class="footer">痛くないおまじない — 授業用・架空場面専用</div></main><script src="data.js"></script><script>
const data=window.CHARM_DATA,cloud=document.querySelector('#cloud'),detail=document.querySelector('#detail'),variants=document.querySelector('#variants');
const colors=['#dceee7','#f7e2da','#e8e3f3','#fff0c9','#dcecf3','#eee8d8'];const sizes=['.88rem','1rem','1.13rem','1.28rem','1.42rem'];const shapes=['a','b','c','d','e'],buttons=[];
function short(s){let one=s.replace(/\n/g,' '),limit=innerWidth<700?20:34;return one.length>limit?one.slice(0,limit-3)+'…':one}
function show(d){document.querySelector('#detailName').textContent=d.name;variants.replaceChildren();d.out.forEach((out,i)=>{let box=document.createElement('article');box.className='variant';let jp=Array.isArray(d.jp)?d.jp[i]:d.jp;box.innerHTML=`<h3>${d.out.length>1?'候補 '+(i+1):'原文全文'}</h3><div class="original" dir="auto"></div><div class="jp" dir="ltr"><strong>日本語訳</strong><br></div>`;box.querySelector('.original').textContent=out;box.querySelector('.jp').append(document.createTextNode(jp));variants.append(box)});detail.hidden=false;detail.focus();detail.scrollIntoView({behavior:'smooth',block:'nearest'})}
data.forEach((d,i)=>{let b=document.createElement('button');b.type='button';b.className=`word shape-${shapes[(i*3+1)%shapes.length]}`;b.dataset.order=i;b.style.setProperty('--c',colors[(i*5+2)%colors.length]);b.style.setProperty('--s',sizes[(i*3+1)%sizes.length]);b.style.setProperty('--rot',`${[-1.7,.9,0,1.5,-.8,1.1][i%6]}deg`);b.style.setProperty('--h',`${[58,72,64,82,60,76][i%6]}px`);b.style.setProperty('--py',`${[10,15,12,18,11,16][i%6]}px`);b.setAttribute('aria-label',`${d.name}の全文を見る`);let lead=short(d.out[0]);b.innerHTML=`<span dir="auto"></span><small></small>`;b.querySelector('span').textContent=lead;b.querySelector('small').textContent=d.name+(lead.endsWith('…')?'・省略表示':'');b.onclick=()=>show(d);cloud.append(b);buttons.push(b)});
function overlaps(a,list,gap){return list.some(b=>a.x<b.x+b.w+gap&&a.x+a.w+gap>b.x&&a.y<b.y+b.h+gap&&a.y+a.h+gap>b.y)}
function packCloud(){const width=cloud.clientWidth,mobile=width<700,pad=mobile?8:12,available=Math.max(260,innerHeight-cloud.getBoundingClientRect().top-8);let gap=mobile?5:7;buttons.forEach((b,i)=>{const ratios=mobile?[.28,.34,.3,.38,.26]:[.12,.17,.145,.2,.11,.18];let bw=Math.max(mobile?82:100,Math.min(mobile?145:215,width*ratios[i%ratios.length]));b.style.width=`${bw}px`;b.style.setProperty('--h',`${mobile?[40,48,43,52,41,47][i%6]:[44,54,48,58,46,55][i%6]}px`);b.style.visibility='hidden'});let height=available,placed=[],success=false;const ordered=[...buttons].sort((a,b)=>(b.offsetWidth*b.offsetHeight)-(a.offsetWidth*a.offsetHeight));for(let round=0;round<6&&!success;round++){placed=[];success=true;const cx=width/2,cy=height/2,tries=9000;for(const b of ordered){let bw=b.offsetWidth,bh=b.offsetHeight,seed=Number(b.dataset.order)+1,spot=null,rx=Math.max(1,width/2-pad-bw/2),ry=Math.max(1,height/2-pad-bh/2);for(let k=0;k<tries;k++){let angle=(k+seed*37)*2.3999632297,r=Math.sqrt((k+.5)/tries),x=cx+Math.cos(angle)*r*rx-bw/2,y=cy+Math.sin(angle)*r*ry-bh/2,rect={x,y,w:bw,h:bh};if(!overlaps(rect,placed,gap)){spot=rect;break}}if(!spot){success=false;break}placed.push(spot);b.style.left=`${spot.x}px`;b.style.top=`${spot.y}px`;}if(!success){gap=Math.max(1,gap-1)}}if(!success){console.warn('Cloud packing used compact fallback');height=available;let cols=mobile?3:7,cellW=(width-pad*2)/cols,cellH=(height-pad*2)/Math.ceil(buttons.length/cols);buttons.forEach((b,i)=>{b.style.setProperty('--rot','0deg');b.style.width=`${Math.min(b.offsetWidth,cellW-6)}px`;b.style.left=`${pad+(i%cols)*cellW+(cellW-b.offsetWidth)/2}px`;b.style.top=`${pad+Math.floor(i/cols)*cellH+(cellH-b.offsetHeight)/2}px`})}cloud.style.height=`${available}px`;buttons.forEach(b=>b.style.visibility='visible')}
requestAnimationFrame(packCloud);let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(packCloud,120)});
document.querySelector('#close').onclick=()=>{detail.hidden=true};
</script></body></html>
